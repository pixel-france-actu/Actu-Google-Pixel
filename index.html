<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pixel Actu — Communauté & Nouveautés</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    /* ============================================================
       VARIABLES CSS : MATERIAL 3 EXPRESSIVE ORIGINEL & EXTENSIONS
       ============================================================ */
    :root[data-theme="dark"] {
      --bg-color: #0f141a;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      
      --nav-bg: rgba(20, 26, 34, 0.75);
      --nav-border: rgba(255, 255, 255, 0.12);
      --nav-shadow: 0 16px 36px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      
      --primary: #a8c7fa;
      --on-primary: #042f5c;
      --primary-container: rgba(168, 199, 250, 0.15);
      --on-primary-container: #d3e3fd;
      --icon-hover-bg: rgba(255, 255, 255, 0.08);

      --card-bg: rgba(23, 31, 41, 0.65);
      --card-border: rgba(255, 255, 255, 0.09);
      --card-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      --tag-bg: rgba(168, 199, 250, 0.12);

      --glow-1: rgba(168, 199, 250, 0.16);
      --glow-2: rgba(124, 172, 248, 0.08);

      --input-bg: rgba(15, 20, 26, 0.85);
      --input-border: rgba(255, 255, 255, 0.15);
      --input-focus: #a8c7fa;
      --danger: #f28b82;
      --danger-container: rgba(242, 139, 130, 0.12);
      --modal-scrim: rgba(0, 0, 0, 0.65);
    }

    :root[data-theme="light"] {
      --bg-color: #f7f9fc;
      --text-main: #191c20;
      --text-muted: #5e6b7c;
      
      --nav-bg: rgba(255, 255, 255, 0.82);
      --nav-border: rgba(0, 0, 0, 0.08);
      --nav-shadow: 0 14px 32px rgba(25, 33, 44, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.85);
      
      --primary: #005ac1;
      --on-primary: #ffffff;
      --primary-container: rgba(0, 90, 193, 0.1);
      --on-primary-container: #005ac1;
      --icon-hover-bg: rgba(0, 0, 0, 0.06);

      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.07);
      --card-shadow: 0 8px 24px rgba(25, 33, 44, 0.06);
      --tag-bg: rgba(0, 90, 193, 0.1);

      --glow-1: rgba(0, 90, 193, 0.07);
      --glow-2: rgba(77, 144, 254, 0.05);

      --input-bg: #ffffff;
      --input-border: rgba(0, 0, 0, 0.16);
      --input-focus: #005ac1;
      --danger: #ba1a1a;
      --danger-container: rgba(186, 26, 26, 0.08);
      --modal-scrim: rgba(25, 28, 32, 0.55);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.25s cubic-bezier(0.2, 0, 0, 1), 
                  color 0.25s cubic-bezier(0.2, 0, 0, 1),
                  border-color 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(ellipse 65% 45% at 50% -12%, var(--glow-1), transparent 72%),
        radial-gradient(ellipse 45% 35% at 88% 22%, var(--glow-2), transparent 65%);
      background-attachment: fixed;
      padding-bottom: 120px;
    }

    .top-nav-wrapper {
      position: sticky;
      top: 14px;
      z-index: 90;
      width: 100%;
      padding: 0 16px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .top-nav {
      pointer-events: auto;
      width: 100%;
      max-width: 840px;
      background: var(--nav-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--nav-border);
      border-radius: 9999px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--nav-shadow);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--primary-container);
      color: var(--on-primary-container);
      font-family: 'Google Sans', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-text {
      font-family: 'Google Sans', sans-serif;
      font-weight: 700;
      font-size: 1.18rem;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .logo-text span {
      color: var(--primary);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .theme-toggle-btn:hover {
      background: var(--icon-hover-bg);
    }

    .theme-toggle-btn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .icon-moon { display: none; }
    .icon-sun { display: block; }
    [data-theme="light"] .icon-moon { display: block; }
    [data-theme="light"] .icon-sun { display: none; }

    .btn-fb {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--on-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s;
    }

    .btn-fb:hover {
      transform: scale(1.05);
    }

    .btn-fb svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    main {
      flex: 1;
      max-width: 840px;
      width: 100%;
      margin: 28px auto 40px;
      padding: 0 16px;
    }

    .hero-banner {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 32px 24px;
      margin-bottom: 30px;
      box-shadow: var(--card-shadow);
      text-align: center;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-container);
      color: var(--on-primary-container);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }

    .hero-pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .hero-banner h1 {
      font-family: 'Google Sans', sans-serif;
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .hero-banner p {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.6;
      max-width: 580px;
      margin: 0 auto;
    }

    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .section-title {
      font-family: 'Google Sans', sans-serif;
      font-size: 1.35rem;
      color: var(--text-main);
      font-weight: 700;
    }

    .section-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Bouton d'ajout dans l'en-tête (en complément du FAB) */
    .btn-add-header {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary-container);
      color: var(--on-primary-container);
      border: 1px solid var(--primary-container);
      font-family: 'Google Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .btn-add-header:hover {
      background: var(--primary);
      color: var(--on-primary);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    }

    .btn-add-header svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .articles-feed {
      display: grid;
      gap: 18px;
    }

    .article-card {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--card-shadow);
      position: relative;
      animation: fadeInCard 0.3s cubic-bezier(0.2, 0, 0, 1);
    }

    @keyframes fadeInCard {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .tag-badge {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--primary);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .btn-card-delete {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-card-delete:hover {
      background: var(--danger-container);
      color: var(--danger);
    }

    .btn-card-delete svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .article-card h2 {
      font-family: 'Google Sans', sans-serif;
      font-size: 1.25rem;
      margin-bottom: 10px;
      color: var(--text-main);
      line-height: 1.35;
    }

    .article-card p {
      color: var(--text-muted);
      font-size: 0.94rem;
      margin-bottom: 18px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
    }

    .empty-state {
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: 24px;
      padding: 48px 24px;
      text-align: center;
      display: none;
    }

    .empty-state svg {
      width: 44px;
      height: 44px;
      fill: var(--text-muted);
      opacity: 0.6;
      margin-bottom: 14px;
    }

    .empty-state h3 {
      font-family: 'Google Sans', sans-serif;
      font-size: 1.1rem;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .empty-state p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* ============================================================
       BARRE FLOTTANTE DU BAS FIXE ET PERMANENTE
       ============================================================ */
    .bottom-nav-container {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 100;
      pointer-events: none;
    }

    .bottom-dock {
      pointer-events: auto;
      background: var(--nav-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--nav-border);
      border-radius: 9999px;
      padding: 6px 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: var(--nav-shadow);
      width: fit-content;
    }

    .dock-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Google Sans', sans-serif;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 9999px;
      gap: 3px;
      min-width: 68px;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .dock-tab svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .dock-tab span {
      font-size: 0.70rem;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
    }

    .dock-tab:hover {
      color: var(--text-main);
      background: var(--icon-hover-bg);
    }

    .dock-tab.active {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .dock-tab.active svg {
      fill: currentColor;
    }

    /* ============================================================
       FLOATING ACTION BUTTON (FAB MATERIAL 3)
       ============================================================ */
    .fab-container {
      position: fixed;
      right: 22px;
      bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      z-index: 95;
    }

    .fab-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      border-radius: 20px;
      padding: 14px 20px;
      font-family: 'Google Sans', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .fab-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
    }

    .fab-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .fab-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    @media (max-width: 600px) {
      .fab-btn span {
        display: none;
      }
      .fab-btn {
        padding: 16px;
        border-radius: 50%;
      }
    }

    /* ============================================================
       MODAL DIALOG MATERIAL 3
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-scrim);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      transition: opacity 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    .modal-overlay.open {
      display: flex;
      opacity: 1;
    }

    .modal-window {
      background: var(--bg-color);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      transform: scale(0.92);
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1);
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.open .modal-window {
      transform: scale(1);
    }

    .modal-header {
      padding: 24px 24px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
    }

    .modal-title {
      font-family: 'Google Sans', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .modal-close-btn:hover {
      background: var(--icon-hover-bg);
      color: var(--text-main);
    }

    .modal-body {
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-family: 'Google Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 12px 14px;
      font-family: 'Roboto', sans-serif;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px var(--primary-container);
    }

    .form-textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.5;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 500px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    .modal-footer {
      padding: 16px 24px 24px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      border-top: 1px solid var(--card-border);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      font-family: 'Google Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 9999px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn-secondary:hover {
      background: var(--icon-hover-bg);
      color: var(--text-main);
    }

    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      font-family: 'Google Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 9999px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .toast-msg {
      position: fixed;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--primary);
      color: var(--on-primary);
      padding: 10px 22px;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.2, 0, 0, 1);
      z-index: 250;
      white-space: nowrap;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- BARRE SUPÉRIEURE -->
  <div class="top-nav-wrapper">
    <header class="top-nav">
      <a href="#" class="logo-container" id="logoHomeLink">
        <div class="logo-badge">P</div>
        <div class="logo-text">Pixel <span>Actu</span></div>
      </a>

      <div class="top-actions">
        <!-- Commutateur de Thème -->
        <button id="themeToggle" class="theme-toggle-btn" aria-label="Changer de thème">
          <svg class="icon-sun" viewBox="0 0 24 24">
            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c
