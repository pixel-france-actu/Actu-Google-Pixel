<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pixel Actu — Communauté & Nouveautés Google Pixel</title>

  <!-- Polices Google : Google Sans & Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700;800&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root[data-theme="dark"] {
      --bg-color: #0f141a;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;

      /* Verre dépoli M3 Expressive originel (Dark) */
      --nav-bg: rgba(20, 26, 34, 0.65);
      --nav-border: rgba(255, 255, 255, 0.12);
      --nav-specular: inset 0 1px 0 0 rgba(255, 255, 255, 0.18);
      --nav-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);

      /* Dock flottant bas */
      --dock-bg: rgba(20, 26, 34, 0.70);
      --dock-border: rgba(255, 255, 255, 0.12);
      --dock-specular: inset 0 1px 0 0 rgba(255, 255, 255, 0.18);
      --dock-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      --dock-tab-active-bg: rgba(168, 199, 250, 0.18);
      --dock-tab-active-color: #a8c7fa;
      --dock-tab-inactive-color: #94a3b8;

      /* Accents Material 3 */
      --primary: #a8c7fa;
      --on-primary: #042f5c;
      --primary-container: rgba(168, 199, 250, 0.15);
      --on-primary-container: #d3e3fd;
      --icon-hover-bg: rgba(255, 255, 255, 0.08);

      /* Cartes & Surfaces */
      --card-bg: rgba(23, 31, 41, 0.58);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(168, 199, 250, 0.35);
      --card-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      --tag-bg: rgba(168, 199, 250, 0.12);

      /* Dialogues & Inputs */
      --dialog-bg: rgba(25, 33, 44, 0.95);
      --input-bg: rgba(15, 20, 27, 0.75);
      --input-border: rgba(255, 255, 255, 0.15);

      /* Halos d'ambiance Google Monet */
      --glow-1: radial-gradient(ellipse 65% 45% at 50% -12%, rgba(168, 199, 250, 0.16), transparent 72%);
      --glow-2: radial-gradient(ellipse 45% 35% at 88% 22%, rgba(124, 172, 248, 0.08), transparent 65%);
    }

    :root[data-theme="light"] {
      --bg-color: #f7f9fc;
      --text-main: #191c20;
      --text-muted: #5e6b7c;

      /* Verre dépoli M3 Expressive originel (Light) */
      --nav-bg: rgba(255, 255, 255, 0.72);
      --nav-border: rgba(0, 0, 0, 0.08);
      --nav-specular: inset 0 1px 0 0 rgba(255, 255, 255, 0.85);
      --nav-shadow: 0 14px 32px rgba(25, 33, 44, 0.08);

      /* Dock flottant bas */
      --dock-bg: rgba(255, 255, 255, 0.76);
      --dock-border: rgba(0, 0, 0, 0.08);
      --dock-specular: inset 0 1px 0 0 rgba(255, 255, 255, 0.95);
      --dock-shadow: 0 14px 32px rgba(25, 33, 44, 0.1);
      --dock-tab-active-bg: rgba(0, 90, 193, 0.12);
      --dock-tab-active-color: #005ac1;
      --dock-tab-inactive-color: #5e6b7c;

      /* Accents Material 3 Light */
      --primary: #005ac1;
      --on-primary: #ffffff;
      --primary-container: rgba(0, 90, 193, 0.1);
      --on-primary-container: #005ac1;
      --icon-hover-bg: rgba(0, 0, 0, 0.06);

      /* Cartes & Surfaces Light */
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(0, 0, 0, 0.06);
      --card-hover-border: rgba(0, 90, 193, 0.3);
      --card-shadow: 0 8px 24px rgba(25, 33, 44, 0.05);
      --tag-bg: rgba(0, 90, 193, 0.1);

      /* Dialogues & Inputs Light */
      --dialog-bg: rgba(255, 255, 255, 0.96);
      --input-bg: rgba(243, 246, 251, 0.92);
      --input-border: rgba(0, 0, 0, 0.12);

      /* Halos d'ambiance Google Monet Light */
      --glow-1: radial-gradient(ellipse 65% 45% at 50% -12%, rgba(0, 90, 193, 0.07), transparent 72%);
      --glow-2: radial-gradient(ellipse 45% 35% at 88% 22%, rgba(77, 144, 254, 0.05), transparent 65%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.28s cubic-bezier(0.2, 0, 0, 1), 
                  color 0.28s cubic-bezier(0.2, 0, 0, 1),
                  border-color 0.28s cubic-bezier(0.2, 0, 0, 1);
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: var(--glow-1), var(--glow-2);
      background-attachment: fixed;
      padding-bottom: calc(116px + env(safe-area-inset-bottom, 0px));
    }

    .top-nav-wrapper {
      position: sticky;
      top: 14px;
      z-index: 90;
      width: 100%;
      padding: 0 16px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .top-nav {
      pointer-events: auto;
      width: 100%;
      max-width: 840px;
      background: var(--nav-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--nav-border);
      border-radius: 9999px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--nav-shadow), var(--nav-specular);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
    }

    .logo-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--primary-container);
      color: var(--primary);
      font-family: 'Google Sans', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 1px var(--nav-border);
    }

    .logo-text {
      font-family: 'Google Sans', sans-serif;
      font-weight: 700;
      font-size: 1.18rem;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .logo-text span {
      color: var(--primary);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.2s;
      position: relative;
    }

    .icon-btn:hover {
      background: var(--icon-hover-bg);
      transform: scale(1.05);
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    /* Voyant vert sur le cadenas quand l'admin est connecté */
    .admin-dot {
      display: none;
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    body.is-admin .admin-dot {
      display: block;
    }

    .icon-moon { display: none; }
    .icon-sun { display: block; }
    [data-theme="light"] .icon-moon { display: block; }
    [data-theme="light"] .icon-sun { display: none; }

    .btn-fb {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--on-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn-fb:hover {
      transform: scale(1.05);
      opacity: 0.92;
    }

    .btn-fb svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    main {
      flex: 1;
      max-width: 840px;
      width: 100%;
      margin: 28px auto 30px;
      padding: 0 16px;
    }

    .hero-banner {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 34px 24px;
      margin-bottom: 30px;
      box-shadow: var(--card-shadow);
      text-align: center;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-container);
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }

    .hero-pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .hero-banner h1 {
      font-family: 'Google Sans', sans-serif;
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .hero-banner p {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.6;
      max-width: 580px;
      margin: 0 auto;
    }

    .section-header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .section-title {
      font-family: 'Google Sans', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .section-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .articles-feed {
      display: grid;
      gap: 18px;
    }

    .article-card {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--card-shadow);
      position: relative;
      transition: border-color 0.25s, transform 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .article-card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-2px);
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .tag-badge {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--primary);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    /* Bouton de suppression d'article visible en mode Admin */
    .btn-delete-article {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #ef4444;
      border-radius: 9999px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      align-items: center;
      gap: 4px;
    }

    body.is-admin .btn-delete-article {
      display: inline-flex;
    }

    .btn-delete-article svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .article-card h2 {
      font-family: 'Google Sans', sans-serif;
      font-size: 1.22rem;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .article-card p {
      color: var(--text-muted);
      font-size: 0.94rem;
      margin-bottom: 18px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
    }

    .bottom-nav-container {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 100;
      pointer-events: none;
    }

    .bottom-dock {
      pointer-events: auto;
      background: var(--dock-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--dock-border);
      border-radius: 9999px;
      padding: 6px 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: var(--dock-shadow), var(--dock-specular);
      width: fit-content;
      margin: 0 auto;
    }

    .dock-tab {
      background: transparent;
      border: none;
      color: var(--dock-tab-inactive-color);
      font-family: 'Google Sans', sans-serif;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 11px;
      border-radius: 9999px;
      gap: 3px;
      min-width: 68px;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .dock-tab svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .dock-tab span {
      font-size: 0.70rem;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
    }

    .dock-tab:hover {
      color: var(--text-main);
      background: var(--icon-hover-bg);
    }

    .dock-tab.active {
      background: var(--dock-tab-active-bg);
      color: var(--dock-tab-active-color);
    }

    .dock-tab.active svg {
      fill: currentColor;
    }

    .admin-fab {
      display: none;
      position: fixed;
      right: calc(20px + env(safe-area-inset-right, 0px));
      bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      z-index: 105;
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      border-radius: 20px;
      padding: 13px 18px;
      cursor: pointer;
      font-family: 'Google Sans', sans-serif;
      font-size: 0.90rem;
      font-weight: 600;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      align-items: center;
      gap: 8px;
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s;
    }

    body.is-admin .admin-fab {
      display: inline-flex;
    }

    .admin-fab:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.45);
    }

    .admin-fab svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--dialog-bg);
      border: 1px solid var(--nav-border);
      border-radius: 28px;
      width: 100%;
      max-width: 520px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      animation: modalIn 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-sheet h3 {
      font-family: 'Google Sans', sans-serif;
      font-size: 1.35rem;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .modal-sheet p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    .form-input, .form-select, .form-textarea {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 14px;
      padding: 10px 14px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--primary);
    }

    .form-textarea {
      min-height: 110px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--nav-border);
      color: var(--text-main);
      border-radius: 9999px;
      padding: 9px 18px;
      font-family: 'Google Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      border: none;
      color: var(--on-primary);
      border-radius: 9999px;
      padding: 9px 20px;
      font-family: 'Google Sans', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-primary:hover {
      opacity: 0.95;
    }

    footer {
      text-align: center;
      padding: 24px 20px;
      color: var(--text-muted);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <div class="top-nav-wrapper">
    <header class="top-nav">
      <a href="#" class="logo-container" id="brandLogo">
        <div class="logo-badge">P</div>
        <div class="logo-text">Pixel <span>Actu</span></div>
      </a>

      <div class="top-actions">
        <!-- Bouton Administration (Cadenas avec indicateur lumineux) -->
        <button id="adminAuthBtn" class="icon-btn" aria-label="Espace Administrateur" title="Connexion Administrateur">
          <div class="admin-dot"></div>
          <svg viewBox="0 0 24 24">

          <svg class="icon-sun" viewBox="0 0 24 24">

          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24">
            <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c3.87 0 7.15-2.45 8.44-5.93-.46.06-.93.1-1.44.1-4.97 0-9-4.03-9-9 0-1.61.43-3.12 1.18-4.43C12.43 3.09 12.22 3 12 3z"/>
          </svg>
        </button>

        <!-- Groupe Facebook -->
        <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="btn-fb" aria-label="Rejoindre le Groupe Facebook" title="Communauté Facebook">
          <svg viewBox="0 0 24 24">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </a>
      </div>
    </header>
  </div>

  <main>
    <section id="heroBanner" class="hero-banner">
      <div class="hero-pill">
        <div class="hero-pill-dot"></div>
        <span>Communauté Francophone Google Pixel</span>
      </div>
      <h1>L'écosystème Pixel en un coup d'œil</h1>
      <p>Actualités matérielles, suivi des versions Beta et astuces photographiques partagées au fil de l'eau.</p>
    </section>

    <div class="section-header">
      <div>
