<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pixel Actu — Communauté & Nouveautés</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg-color: #0f141a;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      
      --nav-bg: rgba(20, 26, 34, 0.65);
      --nav-border: rgba(255, 255, 255, 0.12);
      --nav-shadow: 0 16px 36px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      
      --primary: #a8c7fa;
      --on-primary: #042f5c;
      --primary-container: rgba(168, 199, 250, 0.15);
      --on-primary-container: #d3e3fd;
      --icon-hover-bg: rgba(255, 255, 255, 0.08);

      --card-bg: rgba(23, 31, 41, 0.58);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      --tag-bg: rgba(168, 199, 250, 0.12);

      --glow-1: rgba(168, 199, 250, 0.16);
      --glow-2: rgba(124, 172, 248, 0.08);
    }

    :root[data-theme="light"] {
      --bg-color: #f7f9fc;
      --text-main: #191c20;
      --text-muted: #5e6b7c;
      
      --nav-bg: rgba(255, 255, 255, 0.72);
      --nav-border: rgba(0, 0, 0, 0.08);
      --nav-shadow: 0 14px 32px rgba(25, 33, 44, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.85);
      
      --primary: #005ac1;
      --on-primary: #ffffff;
      --primary-container: rgba(0, 90, 193, 0.1);
      --on-primary-container: #005ac1;
      --icon-hover-bg: rgba(0, 0, 0, 0.06);

      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(0, 0, 0, 0.06);
      --card-shadow: 0 8px 24px rgba(25, 33, 44, 0.05);
      --tag-bg: rgba(0, 90, 193, 0.1);

      --glow-1: rgba(0, 90, 193, 0.07);
      --glow-2: rgba(77, 144, 254, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s cubic-bezier(0.2, 0, 0, 1), 
                  color 0.3s cubic-bezier(0.2, 0, 0, 1),
                  border-color 0.3s cubic-bezier(0.2, 0, 0, 1);
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(ellipse 65% 45% at 50% -12%, var(--glow-1), transparent 72%),
        radial-gradient(ellipse 45% 35% at 88% 22%, var(--glow-2), transparent 65%);
      background-attachment: fixed;
      padding-bottom: 110px;
    }

    /* BARRE DU HAUT */
    .top-nav-wrapper {
      position: sticky;
      top: 14px;
      z-index: 90;
      width: 100%;
      padding: 0 16px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .top-nav {
      pointer-events: auto;
      width: 100%;
      max-width: 840px;
      background: var(--nav-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--nav-border);
      border-radius: 9999px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--nav-shadow);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .logo-badge {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--primary-container);
      color: var(--on-primary-container);
      font-family: 'Google Sans', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-text {
      font-family: 'Google Sans', sans-serif;
      font-weight: 700;
      font-size: 1.18rem;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .logo-text span {
      color: var(--primary);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }

    .theme-toggle-btn:hover {
      background: var(--icon-hover-bg);
    }

    .theme-toggle-btn svg {
      width: 19px;
      height: 19px;
      fill: currentColor;
    }

    .icon-moon { display: none; }
    .icon-sun { display: block; }
    [data-theme="light"] .icon-moon { display: block; }
    [data-theme="light"] .icon-sun { display: none; }

    .btn-fb {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--primary);
      color: var(--on-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.2s;
    }

    .btn-fb:hover {
      transform: scale(1.05);
    }

    .btn-fb svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* CONTENU PRINCIPAL */
    main {
      flex: 1;
      max-width: 840px;
      width: 100%;
      margin: 28px auto 40px;
      padding: 0 16px;
    }

    .hero-banner {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 32px 24px;
      margin-bottom: 30px;
      box-shadow: var(--card-shadow);
      text-align: center;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-container);
      color: var(--on-primary-container);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }

    .hero-pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .hero-banner h1 {
      font-family: 'Google Sans', sans-serif;
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    .hero-banner p {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.6;
      max-width: 580px;
      margin: 0 auto;
    }

    .section-header-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .section-title {
      font-family: 'Google Sans', sans-serif;
      font-size: 1.3rem;
      color: var(--text-main);
    }

    .section-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* BOUTON AJOUTER DANS L'ONGLET */
    .btn-add-tab {
      background: var(--primary-container);
      color: var(--on-primary-container);
      border: 1px solid var(--nav-border);
      padding: 8px 16px;
      border-radius: 9999px;
      font-family: 'Google Sans', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .btn-add-tab:hover {
      background: var(--primary);
      color: var(--on-primary);
      transform: translateY(-1px);
    }

    .btn-add-tab svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .articles-feed {
      display: grid;
      gap: 18px;
    }

    .article-card {
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--card-shadow);
      position: relative;
    }

    .tag-badge {
      display: inline-block;
      background: var(--tag-bg);
      color: var(--primary);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 12px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .article-card h2 {
      font-family: 'Google Sans', sans-serif;
      font-size: 1.22rem;
      margin-bottom: 10px;
      color: var(--text-main);
    }

    .article-card p {
      color: var(--text-muted);
      font-size: 0.94rem;
      margin-bottom: 18px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .card-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-delete-article {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border: none;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-delete-article:hover {
      background: rgba(239, 68, 68, 0.22);
    }

    /* BARRE FLOTTANTE DU BAS (4 ONGLETS) FIXE */
    .bottom-nav-container {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 100;
      pointer-events: none;
    }

    .bottom-dock {
      pointer-events: auto;
      background: var(--nav-bg);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--nav-border);
      border-radius: 9999px;
      padding: 6px 10px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: var(--nav-shadow);
      width: fit-content;
    }

    .dock-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Google Sans', sans-serif;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 11px;
      border-radius: 9999px;
      gap: 3px;
      min-width: 68px;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .dock-tab svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .dock-tab span {
      font-size: 0.70rem;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
    }

    .dock-tab:hover {
      color: var(--text-main);
      background: var(--icon-hover-bg);
    }

    .dock-tab.active {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .dock-tab.active svg {
      fill: currentColor;
    }

    /* MODAL DE PUBLICATION */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }

    .modal-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      box-shadow: var(--card-shadow);
      color: var(--text-main);
    }

    .modal-card h3 {
      font-family: 'Google Sans', sans-serif;
      font-size: 1.25rem;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.92rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 110px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 9999px;
      cursor: pointer;
      font-family: 'Google Sans', sans-serif;
      font-weight: 500;
    }

    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
      border: none;
      padding: 8px 20px;
      border-radius: 9999px;
      cursor: pointer;
      font-family: 'Google Sans', sans-serif;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- BARRE DU HAUT -->
  <div class="top-nav-wrapper">
    <header class="top-nav">
      <a href="#" class="logo-container">
        <div class="logo-badge">P</div>
        <div class="logo-text">Pixel <span>Actu</span></div>
      </a>

      <div class="top-actions">
        <!-- Commutateur de Thème -->
        <button id="themeToggle" class="theme-toggle-btn" aria-label="Changer de thème">
          <svg class="icon-sun" viewBox="0 0 24 24">
            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0z"/>

          <svg class="icon-moon" viewBox="0 0 24 24">

          </svg>
        </button>

        <!-- Groupe Facebook -->
        <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="btn-fb" aria-label="Rejoindre le Groupe Facebook">
          <svg viewBox="0 0 24 24">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </a>
      </div>
    </header>
  </div>

  <!-- ZONE DE CONTENU -->
  <main>
    <section id="heroBanner" class="hero-banner">
      <div class="hero-pill">
        <div class="hero-pill-dot"></div>
        <span>Communauté Francophone Google Pixel</span>
      </div>
      <h1>L'écosystème Pixel en un coup d'œil</h1>
      <p>Actualités matérielles, suivi des versions Beta et astuces photographiques partagées en temps réel.</p>
    </section>

    <!-- EN-TÊTE DE SECTION AVEC LE BOUTON AJOUTER DÉDIÉ -->
    <div class="section-header-wrap">
      <div>
        <h2 id="categoryTitle" class="section-title">Accueil</h2>
        <p id="categoryDesc" class="section-subtitle">Toutes les publications et l'actualité générale</p>
      </div>

      <button id="addArticleBtn" class="btn-add-tab">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        <span>Ajouter</span>
      </button>
    </div>

    <!-- FLUX D'ARTICLES -->
    <section id="articlesContainer" class="articles-feed"></section>
  </main>

  <!-- MODAL DE PUBLICATION AVEC CODE SECRET ALPHA -->
  <div id="publishModal" class="modal-overlay">
    <div class="modal-card">
      <h3 id="modalHeading">Ajouter un article</h3>

      <div class="form-group">
        <label for="adminCodeInput">Code secret administrateur</label>
        <input type="password" id="adminCodeInput" class="form-control" placeholder="Entrez le code secret...">
      </div>

      <div class="form-group">
        <label for="postCategory">Rubrique</label>
        <select id="postCategory" class="form-control">
          <option value="devices">Pixel Phones & Watchs</option>
          <option value="beta">Mises à jour & Beta</option>
          <option value="tips">Astuces du jour</option>
        </select>
      </div>

      <div class="form-group">
        <label for="postTag">Badge / Tag (ex: Pixel 10 Pro, QPR3, Photo)</label>
        <input type="text" id="postTag" class="form-control" placeholder="Pixel 10 Pro">
      </div>

      <div class="form-group">
        <label for="postTitle">Titre de l'article</label>
        <input type="text" id="postTitle" class="form-control" placeholder="Titre de votre article...">
      </div>

      <div class="form-group">
        <label for="postContent">Contenu</label>
        <textarea id="postContent" class="form-control" placeholder="Rédigez votre texte ici..."></textarea>
      </div>

      <div class="modal-actions">
        <button id="cancelModal" type="button" class="btn-secondary">Annuler</button>
        <button id="submitPost" type="button" class="btn-primary">Publier</button>
      </div>
    </div>
  </div>

  <!-- BARRE FLOTTANTE DU BAS PERMANENTE (4 ONGLETS) -->
  <div id="bottomNav" class="bottom-nav-container">
    <nav class="bottom-dock">
      <button class="dock-tab active" data-target="home">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Accueil</span>
      </button>

      <button class="dock-tab" data-target="devices">
        <svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
        <span>Appareils</span>
      </button>

      <button class="dock-tab" data-target="beta">
        <svg viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        <span>Mises à jour</span>
      </button>

      <button class="dock-tab" data-target="tips">
        <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg>
        <span>Astuces</span>
      </button>
    </nav>
  </div>

  <script>
    const SECRET_CODE = "Alpha";

    // Articles par défaut
    const defaultArticles = [
      {
        id: "1",
        category: "devices",
        tag: "Matériel & Écosystème",
        title: "Bienvenue sur l'espace Pixel Phones & Watchs",
        content: "Retrouvez ici les actualités, annonces officielles, comparatifs et retours d'expérience dédiés aux smartphones Pixel et aux montres connectées Pixel Watch de notre communauté.",
        dateStr: "Dossier matériel"
      },
      {
        id: "2",
        category: "beta",
        tag: "Suivi Logiciel",
        title: "Espace des versions Beta d'Android",
        content: "Suivi complet des versions trimestrielles (QPR
